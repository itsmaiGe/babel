name: Build installers
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-dist.js
      - uses: actions/upload-artifact@v4
        with:
          name: babel-mac
          path: |
            dist/Babel Manager.dmg
            dist/build-mac.json
          if-no-files-found: error
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Bounded so a hanging test surfaces as a named timeout instead of a silent
      # stall: node --test buffers each file's output until that file completes,
      # so an unbounded hang hides all of that file's diagnostics. Same files and
      # runner as `npm test`; nothing is skipped or force-exited.
      - run: node --test --test-timeout=120000 test/*.test.js
      - run: node scripts/prepare-installer-payload.js
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Test native core and layout
        working-directory: installer
        run: go test ./internal/...
      - name: Embed icon and DPI manifest
        working-directory: installer
        run: go run github.com/akavel/rsrc@v0.10.2 -ico babel.ico -manifest babel.manifest -o rsrc.syso
      - name: Build native EXE
        working-directory: installer
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          go build -ldflags "-H windowsgui -s -w" -o ..\dist\Babel-Installer.exe .
      - name: Verify embedded bytes and launch native control smoke
        run: node scripts/verify-windows.js
      - uses: actions/upload-artifact@v4
        with:
          name: babel-windows-exe
          path: |
            dist/Babel-Installer.exe
            dist/build-windows.json
          if-no-files-found: error
  prepare-draft:
    needs: [build-mac, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: babel-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare and verify draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release.js prepare "$RELEASE_TAG" "$RELEASE_COMMIT" artifacts
